<head>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-layout {
      max-width: 600px;
      margin: var(--space-12) auto;
      text-align: center;
      border: var(--border-double);
      padding: var(--space-8) var(--space-6);
      background-color: var(--color-bg-card);
      position: relative;
    }

    .contact-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: var(--space-4);
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }

    .contact-statement-editorial {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      line-height: 1.6;
      color: var(--color-teal);
      font-style: italic;
      margin-bottom: var(--space-6);
      border-bottom: var(--border-subtle-style);
      padding-bottom: var(--space-4);
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 500;
    }

    .contact-links a {
      color: var(--color-text-primary);
      text-decoration: underline;
      transition: color 0.3s ease;
    }

    .contact-links a:hover {
      color: var(--color-orange);
    }
  </style>
</head>

        <a href="contact.html" class="active">CONTACT</a>
      </nav>
    </header>

    <div class="page-container" id="page-container">
      <main class="page-content" id="page-content">
        <section class="container">
          <div class="contact-layout reveal">
            <h1 class="contact-title">Correspondence</h1>
            
            <p class="contact-statement-editorial">
              "Open to BD, operations and strategy roles at AI or tech companies in Nairobi, Singapore and UAE."
            </p>

            <div class="contact-links">
              <div>Email: <a href="mailto:lindasagwe@gmail.com">lindasagwe@gmail.com</a></div>
              <div>LinkedIn: <a href="https://www.linkedin.com/in/linda-sagwe/" target="_blank">linkedin.com/in/linda-sagwe/</a></div>
            </div>
          </div>
        </section>
